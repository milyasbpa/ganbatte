name: Ganbatte
options:
  bundleIdPrefix: co.bas
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Ganbatte-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Ganbatte
        excludes:
          - Resources/Cards
      - path: Ganbatte/Resources/Cards
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Ganbatte
        PRODUCT_BUNDLE_IDENTIFIER: co.bas.ganbatte
        INFOPLIST_KEY_CFBundleDisplayName: Ganbatte
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  Ganbatte-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Ganbatte
        excludes:
          - Resources/Cards
      - path: Ganbatte/Resources/Cards
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Ganbatte
        PRODUCT_BUNDLE_IDENTIFIER: co.bas.ganbatte-mac
        INFOPLIST_KEY_CFBundleDisplayName: Ganbatte
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
