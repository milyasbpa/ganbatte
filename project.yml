name: ganbatte
options:
  bundleIdPrefix: co.bas
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"

targets:
  ganbatte-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Models
      - path: Services
      - path: Views
      - path: Resources/ganbatte.db
        buildPhase: resources
      - path: Resources/Assets.xcassets
      - path: Resources/Cards
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: ganbatte
        PRODUCT_BUNDLE_IDENTIFIER: co.bas.ganbatte
        INFOPLIST_KEY_CFBundleDisplayName: ganbatte
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  ganbatte-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App
      - path: Models
      - path: Services
      - path: Views
      - path: Resources/ganbatte.db
        buildPhase: resources
      - path: Resources/Assets.xcassets
      - path: Resources/Cards
        type: folder
        buildPhase: resources
      - path: Resources/AppIcon.icns
        buildPhase: resources
      - path: Resources/NotificationIcon.png
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: ganbatte
        PRODUCT_BUNDLE_IDENTIFIER: co.bas.ganbatte.app
        INFOPLIST_KEY_CFBundleDisplayName: Ganbatte
        INFOPLIST_KEY_CFBundleShortVersionString: "1.0.0"
        INFOPLIST_KEY_CFBundleVersion: "1"
        INFOPLIST_KEY_CFBundleIconFile: AppIcon.icns
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
    postBuildScripts:
      - name: Fix AppIcon
        script: |
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIconName" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconFile AppIcon.icns" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string AppIcon.icns" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          codesign --force --sign - "${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}"
